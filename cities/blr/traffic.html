<!DOCTYPE html>
<html data-theme="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Page Unavailable</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../../assets/css/styles.css" />
</head>

<body>
    <button id="themeToggle" class="theme-toggle-btn" aria-label="Toggle theme" title="Toggle light/dark mode">
        <i class="fas fa-sun"></i>
        <i class="fas fa-moon" style="display:none;"></i>
    </button>

    <div class="container" style="max-width: 760px; margin: 2rem auto;">
        <header class="page-header" style="border-radius: 20px; margin-bottom: 24px;">
            <div class="nav-left">
                <a href="../../index.html" class="nav-home" title="Back to home">
                    <i class="fas fa-home"></i>
                    <span>Nagarika Dhvani</span>
                </a>
            </div>
        </header>

        <div class="info-box" style="padding: 24px;">
            <h2 style="margin-top: 0;">This Page Is Currently Unavailable</h2>
            <p>
                This submission flow is temporarily unavailable on this website.
                Please use civic reporting for currently supported submissions.
            </p>
            <div style="margin-top: 20px; display: flex; gap: 12px; flex-wrap: wrap;">
                <a href="../../index.html" class="upload-btn"
                    style="text-decoration: none; width: auto; min-width: 170px; text-align: center;">
                    <i class="fas fa-home"></i> Back to Home
                </a>
                <a href="./civic.html" class="upload-btn"
                    style="text-decoration: none; width: auto; min-width: 210px; text-align: center;">
                    <i class="fas fa-building"></i> Report Civic Issue
                </a>
            </div>
        </div>

        <div class="app-footer" style="margin-top: 2rem;">
            <small>© Zen Citizen</small>
        </div>
    </div>

    <script>
        const html = document.documentElement;

        function initTheme() {
            const saved = localStorage.getItem("theme");
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const initial = saved || (prefersDark ? "dark" : "light");
            html.setAttribute("data-theme", initial);
            updateThemeToggle(initial);
        }

        function updateThemeToggle(theme) {
            const sun = document.querySelector('#themeToggle .fa-sun');
            const moon = document.querySelector('#themeToggle .fa-moon');
            if (theme === 'dark') {
                sun.style.display = 'none';
                moon.style.display = 'block';
            } else {
                sun.style.display = 'block';
                moon.style.display = 'none';
            }
        }

        initTheme();

        document.getElementById("themeToggle").addEventListener("click", () => {
            const current = html.getAttribute("data-theme") || "light";
            const next = current === "light" ? "dark" : "light";
            html.setAttribute("data-theme", next);
            localStorage.setItem("theme", next);
            updateThemeToggle(next);
        });
    </script>
</body>

</html>
