name: Refresh heatmap and leaderboard data

on:
  push:
    paths:
      - 'data/cities/**/submissions.json'
  workflow_dispatch:
  schedule:
    - cron: '0 */2 * * *'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refresh submissions data
        run: node scripts/submissions-store.mjs refresh

      - name: Commit refreshed data
        run: |
          if git diff --quiet data/cities/blr/submissions.json; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cities/blr/submissions.json
          git commit -m "Refresh heatmap and leaderboard data timestamp"
          git push
